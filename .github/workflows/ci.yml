name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      # Safety net for clones where the pre-commit hook was never installed:
      # a commit that changes the code but not the generated reference fails here.
      - run: npm run docs:check
