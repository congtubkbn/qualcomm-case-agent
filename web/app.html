<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualcomm cases</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #16181d; --muted: #666e7a;
    --line: #e2e5ea; --accent: #1a6fd4; --warn: #b45309; --bad: #b91c1c; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f25; --fg: #e8eaed; --muted: #9aa3af;
      --line: #2b3038; --accent: #5aa2f0; --warn: #d9a441; --bad: #f08a8a; --ok: #6fcf8a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 0 24px 48px; max-width: 1100px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px; margin: 12px 0 18px; }
  input, select, button { font: inherit; color: inherit; background: var(--bg);
         border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
  button { cursor: pointer; background: var(--card); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { color: #fff; opacity: .9; }
  .banner { border-left: 3px solid var(--warn); background: var(--card); padding: 10px 14px;
            border-radius: 8px; margin-bottom: 14px; }
  .case { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .title { font-weight: 600; flex: 1 1 320px; min-width: 0; }
  .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); }
  .tag.ok { color: var(--ok); border-color: currentColor; }
  .tag.bad { color: var(--bad); border-color: currentColor; }
  .tag.warn { color: var(--warn); border-color: currentColor; }
  .tag.new { color: var(--accent); border-color: currentColor; font-weight: 700; }
  .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .detail h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
               color: var(--muted); margin: 14px 0 4px; }
  .detail h3:first-child { margin-top: 0; }
  .detail ul { margin: 4px 0; padding-left: 20px; }
  a { color: var(--accent); }
  .links a { margin-right: 12px; font-size: 13px; }
  .empty { color: var(--muted); padding: 32px 0; }
</style>
</head>
<body>
<header>
  <h1>Qualcomm case cache</h1>
  <span class="muted" id="sweep"></span>
  <span style="flex:1"></span>
  <button id="refresh">Refresh</button>
</header>

<main>
  <div id="auth"></div>

  <div class="bar">
    <input id="newCode" placeholder="8-digit case code" size="14" inputmode="numeric">
    <button class="primary" id="add">Watch case</button>
    <span style="flex:1"></span>
    <label class="muted">every
      <input id="interval" type="number" min="15" step="15" size="4" style="width:6em"> min</label>
    <label class="muted">enrich
      <select id="enrich"><option value="none">none</option><option value="local">local LLM</option></select>
    </label>
    <button id="saveSettings">Save</button>
  </div>

  <div id="list" class="empty">Loading…</div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const ago = iso => {
  if (!iso) return 'never';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (!isFinite(m)) return 'never';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
};
const post = (url, body) => fetch(url, {
  method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}),
}).then(r => r.json());

const RUN_CLASS = { created: 'ok', updated: 'ok', 'no-update': '', 'auth-required': 'bad', blocked: 'bad', error: 'bad', 'not-found': 'warn', busy: 'warn' };
let open = new Set();
const seenKey = code => `qc-seen:${code}`;
const isNew = c => !!c.syncedAt && localStorage.getItem(seenKey(c.code)) !== c.syncedAt;
const markSeen = c => { if (c.syncedAt) localStorage.setItem(seenKey(c.code), c.syncedAt); };

function list(label, items) {
  if (!items || !items.length) return '';
  return `<h3>${label}</h3><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
}

function card(c) {
  const short = c.commentCount < (c.displayedCommentCount ?? c.commentCount);
  const run = c.run ? `<span class="tag ${RUN_CLASS[c.run.status] ?? ''}">${esc(c.run.status)}${c.run.newComments ? ' +' + c.run.newComments : ''}</span>` : '';
  const newBadge = isNew(c) ? '<span class="tag new">NEW</span>' : '';
  const detail = open.has(c.code) && c.cached ? `
    <div class="detail">
      ${c.engineerSummary ? `<h3>Summary</h3><p>${esc(c.engineerSummary)}</p>` : ''}
      ${c.currentStatus ? `<h3>Current status</h3><p>${esc(c.currentStatus)}</p>` : ''}
      ${c.rootCause ? `<h3>Root cause</h3><p>${esc(c.rootCause)}</p>` : ''}
      ${list('Open questions', c.openQuestions)}
      ${list('Recommended actions', c.recommendedActions)}
      ${!c.engineerSummary ? '<p class="muted">No enrichment yet — run the enrich pass to fill this in.</p>' : ''}
      <h3>Files</h3>
      <div class="links">${c.artifacts.map(f => `<a href="/artifact/${c.code}/${f}" target="_blank">${f}</a>`).join('')}
        ${c.url ? `<a href="${esc(c.url)}" target="_blank">portal ↗</a>` : ''}</div>
    </div>` : '';

  return `<div class="case" data-code="${c.code}">
    <div class="row">
      <span class="code">${c.code}</span>
      <span class="title">${esc(c.title || (c.cached ? '(untitled)' : 'not captured yet'))}</span>
      ${newBadge}
      ${c.status ? `<span class="tag">${esc(c.status)}</span>` : ''}
      ${c.priority ? `<span class="tag">${esc(c.priority)}</span>` : ''}
      <span class="tag${short ? ' warn' : ''}">${c.commentCount}${short ? '/' + c.displayedCommentCount : ''} comments</span>
      ${run}
      <span class="muted">synced ${ago(c.syncedAt)}</span>
    </div>
    <div class="row" style="margin-top:8px">
      <button data-act="toggleOpen">${open.has(c.code) ? 'Hide' : 'Details'}</button>
      <button data-act="run">Sync now</button>
      <button data-act="watch">${c.watched ? 'Unwatch' : 'Watch'}</button>
      <button data-act="remove">Remove</button>
      ${c.run?.reason ? `<span class="muted">${esc(c.run.reason)}</span>` : ''}
      ${c.enrichedBy ? `<span class="muted">enriched by ${esc(c.enrichedBy)} ${ago(c.enrichedAt)}</span>` : ''}
    </div>
    ${detail}
  </div>`;
}

let lastCases = [];

async function render() {
  const d = await fetch('/api/overview').then(r => r.json());
  $('#sweep').textContent = d.sweep ? `last sweep ${ago(d.sweep.at)}` : 'no sweep yet';
  $('#auth').innerHTML = d.sweep?.authRequired
    ? '<div class="banner"><b>Sign-in needed.</b> The saved Okta session lapsed — sign in once in the persistent Chrome profile (email OTP is human-only), then hit Sync now.</div>'
    : '';
  if (document.activeElement !== $('#interval')) $('#interval').value = d.watchlist.intervalMinutes;
  if (document.activeElement !== $('#enrich')) $('#enrich').value = d.watchlist.enrich;

  lastCases = [...d.cases].sort((a, b) => {
    const r = (isNew(a) ? 0 : 1) - (isNew(b) ? 0 : 1);
    return r !== 0 ? r : String(b.syncedAt || '').localeCompare(String(a.syncedAt || ''));
  });

  $('#list').className = lastCases.length ? '' : 'empty';
  $('#list').innerHTML = lastCases.length
    ? lastCases.map(card).join('')
    : 'No cases yet — add a case code above to start watching it.';
}

$('#list').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const code = btn.closest('.case').dataset.code;
  const act = btn.dataset.act;
  if (act === 'toggleOpen') {
    const opening = !open.has(code);
    open.has(code) ? open.delete(code) : open.add(code);
    if (opening) {
      const c = lastCases.find(x => x.code === code);
      if (c) markSeen(c);
    }
    return render();
  }
  if (act === 'run') { btn.disabled = true; await post(`/api/run/${code}`); return setTimeout(render, 1500); }
  await post('/api/watchlist', { action: act === 'watch' ? 'toggle' : 'remove', code });
  render();
});

$('#add').onclick = async () => {
  const code = $('#newCode').value.trim();
  const r = await post('/api/watchlist', { action: 'add', code });
  if (r.error) return alert(r.error);
  $('#newCode').value = '';
  await post(`/api/run/${code}`).catch(() => {});
  setTimeout(render, 1500);
};
$('#saveSettings').onclick = async () => {
  await post('/api/watchlist', {
    action: 'settings', intervalMinutes: Number($('#interval').value), enrich: $('#enrich').value,
  });
  render();
};
$('#refresh').onclick = render;

render();
setInterval(render, 20000);
</script>
</body>
</html>
